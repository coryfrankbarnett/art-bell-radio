name: Scan archive.org for Art Bell collections (one-off)
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, re, urllib.request, collections
          UA={"User-Agent":"art-bell-tapes-scan"}
          def get(u): return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=180))
          for ident in ["art-bell-1990-2000","art-bell-2001-to-2010","art-bell-archive","art-bell-episodes","coast-to-coast-am-2004","c2cam-2003-comp","the-ultimate-art-bell-collection-1","the-ultimate-art-bell-collection-2","coast-to-coast-am-2006-to-2010","art-bell-compilations"]:
              try: j=get("https://archive.org/metadata/"+ident)
              except Exception as e: print("FAIL",ident,e); continue
              mp3=[f for f in j.get("files",[]) if f.get("name","").lower().endswith(".mp3") and f.get("source")!="derivative"]
              yrs=collections.Counter((re.search(r"(19|20)\d\d",f["name"].split("/")[-1]) or [None])[0] for f in mp3)
              art=sum(1 for f in mp3 if re.search(r"art.?bell",f["name"],re.I))
              print(f"== {ident}: {len(mp3)} mp3, {art} name Art Bell; years {dict(sorted((k,v) for k,v in yrs.items() if k))}")
              for f in mp3[:: max(1,len(mp3)//6)][:6]: print("   ", f["name"][-110:])
          PY
