<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Art Bell">
<meta name="theme-color" content="#08090c">
<title>Art Bell Radio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Fonts bundled with the app (SIL Open Font License): Space Grotesk (headings), Inter (text), Geist Mono (times) */
@font-face{font-family:'Space Grotesk';src:url(fonts/space-grotesk.woff2) format('woff2-variations');font-weight:300 700;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter.woff2) format('woff2-variations');font-weight:100 900;font-display:swap}
@font-face{font-family:'Geist Mono';src:url(fonts/geist-mono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Geist Mono';src:url(fonts/geist-mono-500.woff2) format('woff2');font-weight:500;font-display:swap}
:root{
  /* ---- Tweak these to restyle the whole app ---- */
  --bg:#08090c;
  --surface:#111318;
  --surface-2:#191c23;
  --line:rgba(255,255,255,.07);
  --text:#f2efe8;
  --muted:#8a8f9c;
  --accent:#ffa53d;          /* late-night amber */
  --accent-soft:rgba(255,165,61,.14);
  --glow:rgba(255,140,30,.35);
  --radius:18px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"Space Grotesk","Inter",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;   /* dates, times, data */
  --serif:"Instrument Serif",Georgia,serif;               /* headlines */
  --grid:rgba(255,255,255,.035);                           /* schematic grid lines */
  /* ----------------------------------------------- */
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:linear-gradient(#000,transparent 45%);mask-image:linear-gradient(#000,transparent 45%)}
body::before{content:"";position:fixed;inset:-20% -30% auto;height:60vh;background:radial-gradient(ellipse at 50% 0%,var(--glow),transparent 65%);opacity:.55;pointer-events:none;z-index:0}

/* Header */
.top{position:relative;z-index:2;padding:calc(18px + var(--st)) 20px 6px}
.eyebrow{font:600 11px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font:400 clamp(40px,11vw,56px)/.95 var(--serif);letter-spacing:-.01em;margin:10px 0 4px}
h1 em{color:var(--accent)}
.sub{color:var(--muted);font:400 12px var(--mono);letter-spacing:.02em}
.demo{margin:12px 20px 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;display:none;position:relative;z-index:2}
.demo.show{display:block}

/* Sticky search block */
.sticky{position:sticky;top:0;z-index:5;padding:10px 20px 18px;padding-top:calc(10px + var(--st));margin-top:-4px;isolation:isolate}
.sticky::before,.sticky::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}
.sticky::before{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.sticky::after{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:linear-gradient(color-mix(in srgb,var(--bg) 70%,transparent) 50%,transparent);-webkit-mask-image:linear-gradient(#000 40%,transparent 85%);mask-image:linear-gradient(#000 40%,transparent 85%)}
.searchbox{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px}
.searchbox svg{width:18px;height:18px;fill:var(--muted);flex:none}
.searchbox input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:16px var(--font);outline:none}
.searchbox input::placeholder{color:var(--muted)}
.clear{color:var(--muted);font-size:13px;display:none}
.clear.show{display:block}

/* Year dial */
.dialwrap{position:relative;margin:6px -20px 0;height:52px}
.dial{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%;padding:0 calc(50% - 32px);align-items:flex-start}
.dial::-webkit-scrollbar{display:none}
.yr{flex:none;width:64px;height:52px;padding-top:2px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;color:var(--muted);transition:color .2s}
.yr b{font:500 12.5px/1 var(--mono);letter-spacing:.02em;transition:transform .2s,color .2s}
.yr .ticks{display:flex;gap:5px;align-items:flex-end;height:14px}
.yr .ticks i{width:1.5px;height:6px;background:currentColor;opacity:.45;border-radius:1px}
.yr .ticks i:nth-child(3){height:14px;opacity:.8}
.yr.on{color:var(--accent)}
.yr.on b{transform:scale(1.2);text-shadow:0 0 14px var(--glow)}
.yr.nodata b{opacity:.4}
.needle{position:absolute;left:50%;top:-4px;height:26px;width:2px;margin-left:-1px;background:var(--accent);border-radius:2px;box-shadow:0 0 12px var(--accent);pointer-events:none;opacity:.9}
.dialwrap::before,.dialwrap::after{content:"";position:absolute;top:0;bottom:0;width:70px;z-index:1;pointer-events:none}
.dialwrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.dialwrap::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}

/* Programme chips */
.filtersblock{padding:0 20px;position:relative;z-index:3}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -20px 0;padding:0 20px 14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* Section header */
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:6px 20px 8px;position:relative;z-index:1}
.sec h2{font:400 clamp(22px,6vw,26px)/1 var(--serif);margin:0}
.sec .meta{color:var(--muted);font:400 11.5px var(--mono);display:flex;gap:12px;align-items:center}
.sec select{background:none;border:0;color:var(--accent);font:500 11.5px var(--mono);-webkit-appearance:none;appearance:none;text-align:right}

/* Continue listening */
.rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 20px 18px;position:relative;z-index:1}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:150px;text-align:left}
.card .art{width:150px;height:150px;border-radius:var(--radius)}
.card .t{font-weight:600;font-size:13.5px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{color:var(--muted);font:400 11px var(--mono);margin-top:2px}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent)}

/* Cover art (generated) */
.art{position:relative;overflow:hidden;flex:none;background:var(--c1);display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,var(--c2),transparent 60%),radial-gradient(circle at 10% 110%,rgba(0,0,0,.55),transparent 60%)}
.art::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:12.5% 12.5%;mix-blend-mode:overlay}
.art > *{position:relative;z-index:1}
.art .em{position:absolute;right:8%;bottom:9%;width:46%;height:46%;color:#fff;opacity:.9;z-index:1;filter:drop-shadow(0 0 10px var(--c2))}
.art.sm .em{right:auto;left:7px;top:7px;bottom:auto;width:20px;height:20px;opacity:.95;filter:none}
.art.sm .sh{display:none}
.art.sm{justify-content:flex-end}
.mini .art .em{left:50%;top:7px;transform:translateX(-50%);width:20px;height:20px}
.card .art .em{width:40%;height:40%}
.np .bigart .em{width:42%;height:42%;right:9%;bottom:auto;top:11%;opacity:.95}
.prog .em{width:64px;height:64px;right:14px;top:14px;bottom:auto;opacity:.9}
.proghead .em{width:110px;height:110px;right:-6px;bottom:-8px;top:auto;opacity:.18;filter:none}
.chip .emi{width:16px;height:16px;flex:none}
.art .sh{font:500 9.5px/1.15 var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.art .yy{font:700 26px/1 var(--display);letter-spacing:-.02em}
.art.sm{width:56px;height:56px;border-radius:12px;padding:6px}
.art.sm .sh{font-size:6.5px;letter-spacing:.04em}
.art.sm .yy{font-size:15px}

/* Bento: "Tonight" dashboard */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 22px;position:relative;z-index:1}
.tile{border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);padding:14px;text-align:left;position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column}
.tile .k{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:400 30px/1 var(--serif);margin-top:auto}
.tile .s{font:400 11px var(--mono);color:var(--muted);margin-top:5px}
.tile svg{width:22px;height:22px;fill:var(--accent)}
.tile.tonight{grid-column:span 2;min-height:170px;background:radial-gradient(circle at 85% 0%,var(--glow),transparent 60%),var(--surface)}
.tile.tonight .big{font:400 clamp(64px,20vw,92px)/.85 var(--serif);letter-spacing:-.03em;margin-top:10px}
.tile.tonight .big em{color:var(--accent)}
.tile.tonight .ep{font-weight:600;font-size:14px;margin-top:10px;padding-right:56px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.tonight .go{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 8px 24px var(--glow)}
.tile.tonight .go svg{fill:#140c02}
.tile.wide{grid-column:span 2;min-height:0;flex-direction:row;align-items:center;gap:12px}
.tile.wide .v{font-size:22px;margin:0}
.tile:active{transform:scale(.98)}

/* Swipe actions on rows (compound gestures + haptics) */
.swipe{position:relative;border-radius:16px;overflow:hidden}
.swipe .bg{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity .15s}
.swipe .bg.l{background:var(--accent-soft);color:var(--accent)}
.swipe .bg.r{justify-content:flex-end;background:rgba(80,160,255,.14);color:#7fb6ff}
.swipe .bg.armed{font-weight:700}
.swipe .row{background:var(--bg);position:relative;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.swipe.dragging .row{transition:none}

/* Guests */
.guests{padding:0 12px calc(170px + var(--sb));position:relative;z-index:1;display:none}
.guests.show{display:block}
.gletter{font:500 11px var(--mono);color:var(--accent);letter-spacing:.1em;padding:14px 8px 4px}
.grow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;border-radius:14px;text-align:left}
.grow:active{background:var(--surface)}
.grow .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:400 18px var(--serif);background:var(--surface-2);color:var(--accent);flex:none}
.grow .n{flex:1;font-weight:600}
.grow .c{font:400 11.5px var(--mono);color:var(--muted)}
.filterpill{display:none;margin:0 20px 12px;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:13.5px;position:relative;z-index:1}
.filterpill.show{display:flex}
.filterpill b{font-weight:600;color:var(--text)}
.filterpill button{margin-left:auto;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.playall{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--accent);color:#140c02;font:600 12px var(--font)}
.playall svg{width:14px;height:14px;fill:currentColor}
/* Sheet lists (queue, bookmarks) */
.sheet{max-height:82vh;overflow:auto}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li .tx{flex:1;min-width:0}
.li .tx .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx .m{font:400 11px var(--mono);color:var(--muted);margin-top:2px}
.li .tm{font:500 13px var(--mono);color:var(--accent);min-width:58px}
.li button.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.li button.x svg{width:18px;height:18px;fill:currentColor}
.sheet .empty{padding:24px 10px}
.field{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:16px var(--font);padding:0 14px;margin:10px 0}
.btn{width:100%;height:48px;border-radius:14px;background:var(--accent);color:#140c02;font-weight:600;margin-top:4px}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.boost .chip-on{color:var(--accent)}

/* Theme swatches */
.swatches{display:flex;gap:10px;padding:6px 0 12px}
.sw{flex:1;border-radius:14px;padding:10px 8px;border:1.5px solid var(--line);text-align:center;font:500 10.5px var(--mono);color:var(--muted)}
.sw i{display:block;height:26px;border-radius:8px;margin-bottom:7px}
.sw.on{border-color:var(--text);color:var(--text)}

/* Programme cards */
.progs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 20px 20px;position:relative;z-index:1;scroll-snap-type:x mandatory;scroll-padding:0 20px}
.progs::-webkit-scrollbar{display:none}
.prog{flex:none;width:210px;height:150px;border-radius:var(--radius);scroll-snap-align:start;text-align:left;padding:14px;justify-content:space-between}
.prog .yrs{font:500 11px/1 var(--mono);letter-spacing:.06em;opacity:.85}
.prog .nm{font:400 26px/1 var(--serif);margin-top:auto}
.prog .ct{font:400 11px var(--mono);opacity:.75;margin-top:6px}
.proghead{position:relative;z-index:1;margin:0 20px 14px;border-radius:var(--radius);padding:16px;display:none;min-height:0;color:#fff}
.proghead.show{display:flex}
.proghead .yrs{font:500 11px/1 var(--mono);letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.proghead .nm{font:400 clamp(30px,8.5vw,38px)/1 var(--serif);margin:10px 0 8px}
.proghead p{margin:0;font-size:13.5px;line-height:1.45;opacity:.85}
.proghead .back{position:absolute;top:12px;right:12px;font-size:12px;font-weight:600;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:999px;z-index:2}

/* Episode rows */
.list{position:relative;z-index:1;padding:0 12px calc(170px + var(--sb))}
.row{display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:16px;width:100%;text-align:left}
.row:active{background:var(--surface)}
.row .info{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.cur .t{color:var(--accent)}
.row .m{color:var(--muted);font:400 11.5px var(--mono);letter-spacing:.01em;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .m .sep{opacity:.5}
.row .m .badge{color:var(--accent)}
.row .bar{width:60px;margin:0}
.row .more{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);flex:none;border-radius:50%}
.row .more svg{width:20px;height:20px;fill:currentColor}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.eq i{width:2.5px;background:var(--accent);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}
.paused .eq i{animation:none;height:4px}
.empty{color:var(--muted);text-align:center;padding:50px 30px;font-size:14px}
.loadmore{display:block;margin:14px auto;height:40px;padding:0 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.progress{height:2px;margin:0 20px 8px;background:var(--line);border-radius:2px;overflow:hidden;display:none;position:relative;z-index:1}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

/* Loading skeleton */
.skel{display:flex;gap:14px;align-items:center;padding:10px 8px}
.skel .a{width:56px;height:56px;border-radius:12px;background:var(--surface-2)}
.skel .l{flex:1}.skel .l i{display:block;height:11px;border-radius:6px;background:var(--surface-2);margin:6px 0}
.skel .l i:last-child{width:45%}
.skel .a,.skel .l i{background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
/* Save progress ring (purposeful motion) */
.ring{width:22px;height:22px}
.ring circle{fill:none;stroke-width:2.5}
.ring .bg{stroke:rgba(255,255,255,.15)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .2s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.done svg{animation:pop .35s ease-out}
/* Settings */
.top{display:flex;justify-content:space-between;align-items:flex-start}
.gear{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);margin-top:2px}
.gear svg{width:19px;height:19px;fill:var(--muted)}
.toggle{margin-left:auto;width:46px;height:28px;border-radius:999px;background:var(--surface-2);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:transform .2s}
.toggle.on{background:var(--accent)}.toggle.on::after{transform:translateX(18px)}
/* Reduced motion: system setting or in-app toggle */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
body.calm .tile:active,body.calm .row:active{transform:none}
body.calm .live{box-shadow:none}
body.calm .np .bgglow{display:none}
html.calm-scroll{scroll-behavior:auto}

/* Mini player */
.mini{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:540px;bottom:calc(74px + var(--sb));z-index:20;display:none;align-items:center;gap:12px;padding:8px 8px 8px 8px;border-radius:18px;background:rgba(24,26,33,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.mini.show{display:flex}
.mini .art{width:44px;height:44px;border-radius:10px;padding:4px}
.mini .art .sh{display:none}.mini .art .yy{font-size:13px;margin-top:auto}
.mini .info{flex:1;min-width:0}
.mini .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .m{color:var(--muted);font:400 11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pp{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.mini .pp svg{width:24px;height:24px;fill:var(--text)}
.mini .line{position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.mini .line i{display:block;height:100%;width:0;background:var(--accent)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:19;display:flex;justify-content:center;background:rgba(8,9,12,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tabs .inner{display:flex;width:100%;max-width:560px}
.tab{flex:1;min-width:0;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:500}
.tab svg{width:22px;height:22px;fill:currentColor}
.tab.on{color:var(--accent)}

/* Now playing (full screen) */
.np{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(12px + var(--st)) 24px calc(22px + var(--sb));overflow:hidden}
.np.open{transform:none}
.np .bgglow{position:absolute;inset:-30% -40% auto;height:80%;background:radial-gradient(circle at 50% 40%,var(--c2,var(--glow)),transparent 60%);opacity:.45;pointer-events:none;transition:background .4s}
.np > *{position:relative}
.np .head{display:flex;align-items:center;justify-content:space-between;height:44px}
.np .head button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.np .head svg{width:26px;height:26px;fill:var(--text)}
.np .head .lbl{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.np .bigart{width:100%;max-width:340px;aspect-ratio:1;margin:min(4vh,28px) auto 0;border-radius:26px;padding:20px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.np .bigart .sh{font-size:12px}
.np .bigart .yy{font:400 clamp(72px,24vw,104px)/.9 var(--serif);letter-spacing:-.02em}
.np .bigart .freq{font:500 11px var(--mono);letter-spacing:.06em;opacity:.8}
.np .meta{margin-top:min(4vh,28px);display:flex;align-items:flex-start;gap:12px}
.np .meta .tx{flex:1;min-width:0}
.np .title{font:400 clamp(26px,7.5vw,32px)/1.1 var(--serif)}
.np .subt{color:var(--muted);font:400 12px var(--mono);margin-top:6px}
.np .fav{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--surface);flex:none}
.np .fav svg{width:22px;height:22px;fill:var(--muted)}
.np .fav.on svg{fill:var(--accent)}
.scrub{margin-top:20px;position:relative;height:64px;touch-action:none;cursor:pointer}
.scrub canvas{width:100%;height:100%;display:block}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.bubble{position:absolute;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--text);color:var(--bg);font:600 13px var(--mono);padding:6px 10px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;font-variant-numeric:tabular-nums}
.bubble.show{opacity:1}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--text)}
.scrubmode{color:var(--accent);font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-align:center;flex:1}
.times{display:flex;justify-content:space-between;color:var(--muted);font:400 11.5px var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctl button{width:56px;height:56px;display:grid;place-items:center;border-radius:50%}
.ctl svg{width:30px;height:30px;fill:var(--text)}
.ctl .skip svg{width:34px;height:34px}
.ctl .big{width:78px;height:78px;background:var(--accent);box-shadow:0 10px 30px var(--glow)}
.ctl .big svg{width:36px;height:36px;fill:#1b1104}
.extras{display:flex;justify-content:space-around;margin-top:auto;padding-top:18px}
.extras button{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px;min-width:60px}
.extras svg{width:22px;height:22px;fill:currentColor}
.extras .on{color:var(--accent)}
.extras b{font:500 14px/22px var(--mono);height:22px;color:var(--text)}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;transform:translate(-50%,100%);z-index:61;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + var(--sb));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:translate(-50%,0)}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:0 auto 14px}
.sheet .hd{display:flex;gap:14px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sheet .hd .t{font-weight:600}
.sheet .hd .m{color:var(--muted);font-size:12.5px;margin-top:2px}
.sheet .act{display:flex;align-items:center;gap:14px;width:100%;height:52px;text-align:left;font-size:15px;color:var(--text);text-decoration:none}
.sheet .act svg{width:22px;height:22px;fill:var(--muted)}
.sheet .act small{margin-left:auto;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--sb));transform:translate(-50%,10px);background:var(--text);color:var(--bg);font-weight:500;font-size:13px;padding:10px 16px;border-radius:999px;z-index:80;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.np.open ~ .toast{bottom:auto;top:calc(64px + var(--st))}

/* ================= 2026 refresh: one modern typeface, less decoration ================= */
:root{
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"Space Grotesk","Inter",-apple-system,sans-serif;
  --serif:"Space Grotesk","Inter",-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --radius:22px;
  --line:rgba(255,255,255,.08);
}
html,body{letter-spacing:0}
body::after{display:none}
body::before{opacity:.32;height:48vh}
.top{padding-top:calc(22px + var(--st))}
.eyebrow{font:500 12px/1 var(--font);letter-spacing:0;text-transform:none;color:var(--muted);gap:7px}
.live{width:6px;height:6px;animation:none;box-shadow:0 0 0 3px var(--accent-soft)}
h1{font:700 clamp(38px,10.5vw,50px)/1 var(--font);letter-spacing:-.045em;margin:12px 0 6px}
h1 em{font-style:normal;color:var(--accent)}
.sub{font:500 13px var(--font);letter-spacing:0;text-transform:none;color:var(--muted)}
.gear{background:var(--surface);border:1px solid var(--line)}
.demo{border-radius:14px;font:500 13px/1.4 var(--font)}
.searchbox{height:50px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.dialwrap::before,.dialwrap::after{width:56px}
.yr b{font:500 13px/1 var(--font);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.yr.on b{transform:scale(1.15);text-shadow:none;font-weight:700}
.needle{width:2px;box-shadow:none;opacity:1}
.chip{height:36px;padding:0 14px;font:500 14px var(--font);letter-spacing:-.01em;border-radius:12px}
.chip.on{background:var(--text);color:var(--bg)}
.sec{padding:10px 20px 10px}
.sec h2{font:700 21px/1.1 var(--font);letter-spacing:-.03em}
.sec .meta{font:500 13px var(--font);letter-spacing:0;color:var(--muted)}
.sec select{font:600 13px var(--font);letter-spacing:0}
/* bento */
.tile{border-radius:22px;background:var(--surface);border:1px solid var(--line);padding:16px}
.tile .k{font:500 12.5px var(--font);letter-spacing:0;text-transform:none;color:var(--muted)}
.tile .v{font:700 30px/1 var(--font);letter-spacing:-.04em}
.tile .s{font:500 12.5px var(--font);letter-spacing:0}
.tile.tonight{background:radial-gradient(120% 90% at 100% 0%,var(--accent-soft),transparent 60%),var(--surface)}
.tile.tonight .big{font:700 clamp(58px,17vw,80px)/.9 var(--font);letter-spacing:-.06em}
.tile.tonight .big em{font-style:normal;color:var(--muted);font-weight:600}
.tile.tonight .ep{font:600 16px/1.3 var(--font);letter-spacing:-.015em}
.tile.wide .v{font-size:20px}
/* covers */
.art::after{display:none}
.art .sh{font:600 9.5px/1.2 var(--font);letter-spacing:.06em}
.art .yy{font:700 24px/1 var(--font);letter-spacing:-.05em}
.art.sm{border-radius:14px}
.art.sm .yy{font-size:15px;letter-spacing:-.03em}
/* programme cards */
.prog{border-radius:22px;height:156px}
.prog .yrs{font:500 12px/1 var(--font);letter-spacing:0;opacity:.85}
.prog .nm{font:700 22px/1.05 var(--font);letter-spacing:-.035em}
.prog .ct{font:500 12.5px var(--font);letter-spacing:0}
.proghead{border-radius:22px}
.proghead .yrs{font:500 12px var(--font);letter-spacing:0;text-transform:none}
.proghead .nm{font:700 clamp(28px,8vw,34px)/1.05 var(--font);letter-spacing:-.04em}
.proghead p{font:400 14.5px/1.5 var(--font)}
.proghead .back{font:600 12px var(--font);border-radius:10px}
/* rows */
.row{border-radius:18px;gap:14px}
.row .t{font:600 15.5px/1.3 var(--font);letter-spacing:-.015em}
.row .m{font:500 13px var(--font);letter-spacing:0;font-variant-numeric:tabular-nums}
.card .t{font:600 14px/1.3 var(--font);letter-spacing:-.01em}
.card .m{font:500 12px var(--font);letter-spacing:0}
.card .art{border-radius:20px}
.playall{font:600 13px var(--font);height:32px;border-radius:12px}
.loadmore{font:600 14px var(--font);border-radius:14px}
/* guests */
.gletter{font:700 14px var(--font);letter-spacing:0}
.grow .av{font:700 17px var(--font);border-radius:14px}
.grow .c{font:500 13px var(--font)}
.filterpill{border-radius:14px;font:500 14px var(--font)}
.filterpill button{font:600 12px var(--font);letter-spacing:0;text-transform:none}
/* floating tab bar */
.tabs{left:12px;right:12px;bottom:calc(10px + var(--sb));padding:0;border:1px solid var(--line);border-radius:26px;background:rgba(18,20,25,.93);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.tab{height:60px;font:500 10.5px var(--font);letter-spacing:0}
.tab svg{width:21px;height:21px}
.mini{bottom:calc(84px + var(--sb));border-radius:20px;background:rgba(28,30,37,.92)}
.mini .t{font:600 14px var(--font);letter-spacing:-.01em}
.mini .m{font:500 12px var(--font)}
.list,.guests{padding-bottom:calc(190px + var(--sb))}
/* now playing */
.np .head .lbl{font:600 11px/1.4 var(--font);letter-spacing:.04em}
.np .bigart{border-radius:30px}
.np .bigart .yy{font:700 clamp(84px,26vw,118px)/.85 var(--font);letter-spacing:-.07em}
.np .bigart .sh,.np .bigart .freq{font:600 11px var(--font);letter-spacing:.06em}
.np .title{font:700 clamp(22px,6.4vw,27px)/1.15 var(--font);letter-spacing:-.03em}
.np .subt{font:500 14px var(--font);letter-spacing:0}
.times{font:500 12px var(--mono)}
.scrubmode{font:600 11px var(--font);letter-spacing:.02em;text-transform:none}
.bubble{font:600 13px var(--mono);border-radius:12px}
.extras button{font:500 11.5px var(--font)}
.extras b{font:700 15px/22px var(--font);letter-spacing:-.02em}
/* sheets & toasts */
.sheet{border-radius:28px 28px 0 0}
.sheet .hd .t{font:700 17px var(--font);letter-spacing:-.02em}
.sheet .hd .m{font:500 13px var(--font)}
.li .tm{font:500 13px var(--mono)}
.li .tx .m{font:500 12px var(--font)}
.sw{font:500 12px var(--font);border-radius:16px}
.field{border-radius:14px}
.btn{border-radius:16px;font:600 15px var(--font)}
.toast{font:600 13.5px var(--font);border-radius:16px;bottom:calc(160px + var(--sb))}

/* ---- Type: Space Grotesk headings (light/bold contrast) + Inter text ---- */
html,body{font-feature-settings:"cv11","ss03";}
h1,.sec h2,.tile .v,.tile.tonight .big,.prog .nm,.proghead .nm,.np .title,.np .bigart .yy,.art .yy,.sheet .hd .t,.gletter,.grow .av,.extras b{font-family:var(--display)}
h1{font-weight:300;font-size:clamp(42px,12vw,56px);letter-spacing:-.055em;line-height:.95}
h1 em{font-weight:700;letter-spacing:-.045em}
.sec h2{font-weight:500;font-size:22px;letter-spacing:-.035em}
.tile.tonight .big{font-weight:300;letter-spacing:-.07em;font-size:clamp(64px,19vw,92px)}
.tile.tonight .big em{font-weight:600;color:var(--accent);letter-spacing:-.05em}
.tile .v{font-weight:500;letter-spacing:-.045em}
.tile.tonight .ep,.row .t,.card .t{font-weight:550;letter-spacing:-.02em}
.prog .nm{font-weight:500;font-size:23px;letter-spacing:-.04em;line-height:1}
.proghead .nm{font-weight:500;letter-spacing:-.045em;font-size:clamp(30px,9vw,38px)}
.np .title{font-weight:500;letter-spacing:-.035em;font-size:clamp(24px,7vw,29px);line-height:1.08}
.np .bigart .yy{font-weight:300;letter-spacing:-.075em;font-size:clamp(84px,25vw,112px)}
.art .yy{font-weight:500;letter-spacing:-.05em}
.row .t{font-size:15.5px}
.row .m,.card .m{font-feature-settings:"tnum"}
.sheet .hd .t{font-weight:500;letter-spacing:-.03em;font-size:19px}
.grow .av{font-weight:500}
.gletter{font-weight:500;font-size:15px}
.extras b{font-weight:500;letter-spacing:-.03em}
.art .sh,.np .bigart .sh,.np .bigart .freq{font-family:var(--font);font-weight:600;letter-spacing:.06em}

/* ================= 2026 streaming patterns ================= */
/* shelves */
.shelf .sec{padding-bottom:12px}
.seeall{font:600 13px var(--font);color:var(--muted)}
.shelf .rail{padding-bottom:24px;scroll-snap-type:x mandatory;scroll-padding:0 20px}
.shelf .card{width:156px;scroll-snap-align:start}
.shelf .card .art{width:156px;height:156px;border-radius:18px}
.shelf .card .t{font-size:14.5px;margin-top:10px}
/* stronger display weight for headings (heavy grotesque + clean sans pairing) */
.sec h2{font-weight:650;font-size:23px;letter-spacing:-.04em}
.prog .nm{font-weight:650}
.np .title{font-weight:650;letter-spacing:-.04em}
/* now playing: art-led colour wash, bigger flatter art, darker flatter controls */
.np{background:linear-gradient(180deg,color-mix(in srgb,var(--npc,#ff9a2e) 42%,var(--bg)) 0%,color-mix(in srgb,var(--npc,#ff9a2e) 14%,var(--bg)) 45%,var(--bg) 78%)}
.np .bgglow{display:none}
.np .bigart{max-width:420px;width:100%;border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.np .meta{margin-top:26px}
.np .fav{background:rgba(255,255,255,.08)}
.ctl .big{background:var(--text);box-shadow:none}
.ctl .big svg{fill:var(--bg)}
.extras button{opacity:.85}
.extras .on{opacity:1}
/* mini player: tinted by the programme, progress along the top edge */
.mini{background:linear-gradient(90deg,color-mix(in srgb,var(--mc,#ff9a2e) 34%,#15171c) 0%,#15171c 75%);border:1px solid rgba(255,255,255,.07);padding:8px 10px 8px 8px;overflow:hidden}
.mini .art{width:48px;height:48px;border-radius:12px}
.mini .line{left:0;right:0;top:0;bottom:auto;height:2px;border-radius:0;background:rgba(255,255,255,.08)}
.mini .line i{background:var(--text)}
.mini .pp{background:var(--text);width:40px;height:40px}
.mini .pp svg{fill:var(--bg);width:20px;height:20px}

/* ================= More fun ================= */
/* living emblems: each programme's icon has its own little motion */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes hover{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(0,-7%) rotate(3deg)}}
@keyframes pulse{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.75;transform:scale(1.05)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes flip{0%,80%{transform:rotate(0)}90%,100%{transform:rotate(180deg)}}
@keyframes orbit{to{transform:rotate(360deg)}}
.prog .em,.np .bigart .em,.hem{transform-origin:50% 50%}
.prog .a-ghost,.np .bigart .a-ghost{animation:floaty 3.2s ease-in-out infinite}
.prog .a-area,.np .bigart .a-area{animation:hover 4s ease-in-out infinite}
.prog .a-coast,.np .bigart .a-coast{animation:pulse 2.4s ease-in-out infinite}
.prog .a-dream,.np .bigart .a-dream{animation:sway 6s ease-in-out infinite}
.prog .a-time,.np .bigart .a-time{animation:flip 6s ease-in-out infinite}
.prog .a-dark,.np .bigart .a-dark{animation:orbit 18s linear infinite}
.prog .a-midnight,.np .bigart .a-midnight{animation:pulse 4s ease-in-out infinite}
.prog .a-art,.np .bigart .a-art{animation:floaty 4s ease-in-out infinite}
.np:not(.open) .bigart .em{animation-play-state:paused}
/* springy presses */
.prog,.tile,.card,.chip,.shelf .card .art{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.prog:active{transform:scale(.95) rotate(-1.5deg)}
.card:active .art{transform:scale(.94) rotate(1.5deg)}
.tile:active{transform:scale(.96)}
.chip:active{transform:scale(.92)}
/* programmes first: bigger, bolder cards */
#progWrap .sec{padding-top:6px}
.prog{width:230px;height:176px}
.prog .em{width:84px;height:84px}
/* shelf headings get their programme's little emblem */
.shelf .sec h2{display:flex;align-items:center;gap:10px}
.hem{width:26px;height:26px;color:var(--accent);flex:none}
/* Wild Card dial */
.tile[data-t=spin] .v{font-size:24px}
.tile.spinning{animation:jiggle .14s linear infinite}
.tile.spinning svg{animation:orbit .5s linear infinite}
@keyframes jiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
/* UFO easter egg */
.ufo{position:fixed;left:-80px;z-index:30;width:56px;height:56px;color:#c9ffd1;filter:drop-shadow(0 0 10px rgba(120,255,160,.7));animation:fly 9s linear forwards}
.ufo svg{width:100%;height:100%;animation:hover 1.6s ease-in-out infinite}
.ufo.caught{animation:zoomoff .5s ease-in forwards}
@keyframes fly{0%{transform:translateX(0) translateY(0)}25%{transform:translateX(30vw) translateY(14px)}50%{transform:translateX(55vw) translateY(-8px)}75%{transform:translateX(80vw) translateY(10px)}100%{transform:translateX(calc(100vw + 160px)) translateY(-20px)}}
@keyframes zoomoff{to{transform:translate(40vw,-200px) scale(.2);opacity:0}}
</style>

<div class="app">
  <div class="top">
    <div>
      <div class="eyebrow"><span class="live"></span><span id="greet">From the high desert</span></div>
      <h1>Art <em>Bell</em></h1>
      <div class="sub" id="count">Loading the archive…</div>
    </div>
    <button class="gear" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7 7 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7 7 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
  </div>
  <div class="demo" id="demo">Preview mode: showing sample shows. When the app is hosted, the full library loads live from archive.org.</div>

  <div class="sticky">
    <label class="searchbox">
      <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 0 3.7 10.7l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="q" type="search" placeholder="Guest, topic, date…" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clear" type="button">Clear</button>
    </label>
  </div>
  <div class="filtersblock">
    <div class="dialwrap"><div class="dial" id="dial"></div><div class="needle"></div></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="progress" id="progress"><i></i></div>

  <section id="progWrap" style="display:none">
    <div class="sec"><h2>Programmes</h2><div class="meta">Swipe →</div></div>
    <div class="progs" id="progs"></div>
  </section>

  <section id="contWrap" style="display:none">
    <div class="sec"><h2>Pick up where you left off</h2></div>
    <div class="rail" id="rail"></div>
  </section>

  <div id="shelves"></div>

  <div class="bento" id="bento" style="display:none"></div>
  <div class="art proghead" id="progHead"></div>

  <div class="filterpill" id="pill"></div>
  <div class="sec">
    <h2 id="secTitle">All shows</h2>
    <div class="meta"><button class="playall" id="playAll" style="display:none"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Play all</button><span id="secCount"></span>
      <select id="sort" aria-label="Sort">
        <option value="old">Oldest</option><option value="new">Newest</option><option value="az">A–Z</option><option value="rand">Shuffle</option>
      </select>
    </div>
  </div>
  <div class="list" id="list"></div>
  <div class="guests" id="guests"></div>
</div>

</div>

  <button class="tab" data-tab="guests"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5zM19 8V6h-2V4h-2v2h-2v2h2v2h2V8z" transform="translate(0 0)"/></svg>Guests</button>
  <button class="tab" data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 17.3 6.2 21l1.6-6.6L2.7 10l6.7-.6L12 3.2l2.6 6.2 6.7.6-5.1 4.4 1.6 6.6z"/></svg>Favourites</button>
  <button class="tab" data-tab="recent"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.1 5l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8z"/></svg>Recent</button>
  <button class="tab" data-tab="saved"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zm7-3 6-6-1.4-1.4-3.6 3.6V3h-2v10.2L7.4 9.6 6 11z"/></svg>Offline</button>
</div></nav>

  <div class="bgglow" id="npGlow"></div>
  <div class="head">
    <button id="npClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
    <div class="lbl">Now playing<br><span id="npShow" style="color:var(--text);letter-spacing:.08em"></span></div>

  </div>

    <div class="tx"><div class="title" id="npTitle"></div><div class="subt" id="npSub"></div></div>
    <button class="fav" id="npFav" aria-label="Favourite"><svg viewBox="0 0 24 24"><path d="M12 17.3 6.2 21l1.6-6.6L2.7 10l6.7-.6L12 3.2l2.6 6.2 6.7.6-5.1 4.4 1.6 6.6z"/></svg></button>
  </div>

    <button class="big" id="pp" aria-label="Play or pause"></button>

    <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  </div>
  <div class="extras">

    <button id="markBtn"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span id="markVal">Mark</span></button>
    <button id="queueBtn"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm14-1V9l5 3z"/></svg><span id="queueVal">Up next</span></button>
    <button id="boostBtn"><svg viewBox="0 0 24 24"><path d="M3 10v4h3l5 4V6L6 10zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg><span>Boost</span></button>
  </div>
</div>

/* ================= Helpers ================= */

const store = {

};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const I = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5.1v13.8a1 1 0 0 0 1.5.9l10.6-6.9a1 1 0 0 0 0-1.7L9.5 4.2A1 1 0 0 0 8 5.1z"/></svg>',

const state = Object.assign({ favs:{}, pos:{}, recent:[], speed:1, last:null, sort:'old', queue:[], marks:{}, autoplay:true, boost:false }, store.get(STATE_KEY, {}));

/* ================= Parsing ================= */
function normaliseShow(s){
  const l = s.toLowerCase();
  if(/ghost to ghost/.test(l)) return 'Ghost to Ghost';
  if(/somewhere in time/.test(l)) return 'Somewhere in Time';
  if(/midnight in the desert/.test(l)) return 'Midnight in the Desert';
  if(/dark matter/.test(l)) return 'Dark Matter';
  if(/dreamland/.test(l)) return 'Dreamland';
  if(/area 2000/.test(l)) return 'Area 2000';
  if(/coast|c2c|open lines/.test(l)) return 'Coast to Coast AM';
  return 'Art Bell';
}
const parseLength = v => !v ? 0 : /^\d+(\.\d+)?$/.test(v) ? +v : v.split(':').reduce((a,x)=>a*60+(+x||0),0);

  const dm = base.match(/(\d{4})[-_.](\d{2})[-_.](\d{2})/);
  if(dm){ date = `${dm[1]}-${dm[2]}-${dm[3]}`; rest = base.replace(dm[0],''); }
  else { const ym = base.match(/(?<!\d)(19[89]\d|20[0-2]\d)(?!\d)/); if(ym) date = ym[1]; }

}
const NOT_GUEST = /^(open lines|area 51|coast to coast|ghost to ghost|dark matter|dreamland|midnight in the desert|somewhere in time|predictions|annual|y2k|best of|halloween|launch night|callers|part \d|hour \d|the |art bell|art’s|art's)/i;

  $('#dial').innerHTML = html;
}

let dialT, dialLock = false;
dial.addEventListener('scroll', () => {
  clearTimeout(dialT);
  const mid = dial.scrollLeft + dial.clientWidth/2;
  let best = null, bd = 1e9;
  dial.querySelectorAll('.yr').forEach(b => { const c = b.offsetLeft + b.offsetWidth/2, d = Math.abs(c-mid); if(d < bd){ bd = d; best = b; } });
  dial.querySelectorAll('.yr').forEach(b => b.classList.toggle('on', b === best));
  if(dialLock) return;
  dialT = setTimeout(() => { if(best && best.dataset.y !== yearFilter){ yearFilter = best.dataset.y; if(navigator.vibrate && !calm()) navigator.vibrate(8); applyFilters(); } }, 160);

/* Filtering */
let shuffleSeed = Math.random();
function applyFilters(){
  const terms = $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list = episodes;
  if(tab === 'fav') list = list.filter(e => state.favs[e.id]);
  if(tab === 'saved') list = list.filter(e => savedKeys.has(e.id));
  if(tab === 'recent') list = state.recent.map(byId).filter(Boolean);
  if(showFilter) list = list.filter(e => e.show === showFilter);
  if(yearFilter) list = list.filter(e => e.year === yearFilter);
  if(guestFilter) list = list.filter(e => e.guests.includes(guestFilter));
  let ranked = false;
  if(terms.length){
    const exact = list.filter(e => terms.every(t => e.hay.includes(t)));
    const q = $('#q').value.trim();
    if(fuse && q.length > 2 && !/^\d+$/.test(q)){
      const allowed = new Set(list.map(e => e.id)), seen = new Set(exact.map(e => e.id));
      const fuzzy = fuse.search(q, { limit:300 }).map(r => r.item).filter(e => allowed.has(e.id) && !seen.has(e.id));
      list = exact.concat(fuzzy); ranked = fuzzy.length > 0;
    } else list = exact;
  }
  if(tab !== 'recent' && !ranked){
    list = list.slice(); const s = state.sort;
    if(s==='old') list.sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
    if(s==='new') list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(s==='az') list.sort((a,b)=>a.title.localeCompare(b.title));
    if(s==='rand'){ const h = id => { let x=0; for(const c of id) x=(x*31+c.charCodeAt(0))|0; return Math.sin(x+shuffleSeed); }; list.sort((a,b)=>h(a.id)-h(b.id)); }
  }
  view = list; shown = PAGE; render();
}

      </div>
      <button class="more" data-act="more" aria-label="More options">${I.more}</button>
    </div></div>`;
  }).join('') + (view.length > shown ? `<button class="loadmore" id="loadmore">Show more · ${(view.length-shown).toLocaleString('en-GB')} left</button>` : '');
}

// Swipe right = favourite, swipe left = save offline (with haptic tick at the threshold)
(function(){
  const list = $('#list'); let sw = null, row = null, x0 = 0, y0 = 0, dx = 0, dir = null, armed = false, justSwiped = false;
  const TH = 84;
  list.addEventListener('touchstart', ev => { const s = ev.target.closest('.swipe'); if(!s || ev.target.closest('.more')) return; sw = s; row = s.querySelector('.row'); x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; dx = 0; dir = null; armed = false; }, {passive:true});
  list.addEventListener('touchmove', ev => {
    if(!sw) return; const x = ev.touches[0].clientX - x0, y = ev.touches[0].clientY - y0;
    if(!dir){ if(Math.abs(x) > 10 && Math.abs(x) > Math.abs(y)*1.4) dir = 'h'; else if(Math.abs(y) > 10){ sw = null; return; } else return; }
    ev.preventDefault(); sw.classList.add('dragging');
    dx = Math.sign(x) * Math.min(Math.abs(x), 140) * (Math.abs(x) > TH ? .9 : 1);
    row.style.transform = `translateX(${dx}px)`;
    sw.querySelector('.bg.l').style.opacity = dx > 0 ? 1 : 0; sw.querySelector('.bg.r').style.opacity = dx < 0 ? 1 : 0;
    const nowArmed = Math.abs(dx) > TH;
    if(nowArmed !== armed){ armed = nowArmed; sw.querySelectorAll('.bg').forEach(b => b.classList.toggle('armed', armed)); if(armed && navigator.vibrate && !calm()) navigator.vibrate(12); }
  }, {passive:false});
  list.addEventListener('touchend', () => {
    if(!sw) return; const s = sw, r = row; sw = null; s.classList.remove('dragging'); r.style.transform = '';
    setTimeout(() => s.querySelectorAll('.bg').forEach(b => b.style.opacity = 0), 250);
    if(dir !== 'h') return; justSwiped = true; setTimeout(() => justSwiped = false, 350);
    if(!armed) return; const e = byId(r.dataset.id); if(!e) return;
    if(dx > 0) toggleFav(e); else (savedKeys.has(e.id) ? removeOffline(e) : saveOffline(e));
  });
  list.addEventListener('click', ev => { if(justSwiped){ ev.stopImmediatePropagation(); ev.preventDefault(); } }, true);
})();

/* ================= Guests ================= */
let guestCounts = [];
function buildGuests(){
  const m = new Map(); episodes.forEach(e => e.guests.forEach(g => m.set(g, (m.get(g)||0) + 1)));
  const min = episodes.length > 200 ? 2 : 1;
  const sur = g => g.replace(/^(Dr\.?|Prof\.?|Rev\.?|Col\.?|Maj\.?|Sgt\.?)\s/, '').split(' ').pop();
  guestCounts = [...m.entries()].filter(([,c]) => c >= min).sort((a,b) => sur(a[0]).localeCompare(sur(b[0])) || a[0].localeCompare(b[0]));
}
function renderGuests(){
  const q = $('#q').value.trim().toLowerCase();
  const list = guestCounts.filter(([g]) => !q || g.toLowerCase().includes(q));
  if(!list.length){ $('#guests').innerHTML = `<div class="empty">${guestCounts.length ? 'No guests match that.' : 'No guest names found yet.'}</div>`; return; }
  let html = `<div class="sec" style="padding-left:8px"><h2>Guests</h2><div class="meta">${list.length.toLocaleString('en-GB')} people</div></div>`, last = '';
  for(const [g, c] of list){
    const sur = g.replace(/^(Dr\.?|Prof\.?|Rev\.?)\s/, '').split(' ').pop(), L = sur[0].toUpperCase();
    if(L !== last){ html += `<div class="gletter">${L}</div>`; last = L; }
    html += `<button class="grow" data-g="${esc(g)}"><span class="av">${esc(g.replace(/^(Dr\.?|Prof\.?|Rev\.?)\s/,'')[0])}</span><span class="n">${esc(g)}</span><span class="c">${c} show${c>1?'s':''}</span></button>`;
  }
  $('#guests').innerHTML = html;
}

/* ================= Shelves (streaming-app style rows per programme) ================= */
function dailyPick(list, n){
  const seed = new Date().toISOString().slice(0,10); let x = 0; for(const c of seed) x = (x*31 + c.charCodeAt(0)) | 0;
  const r = () => (x = (x*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  return list.slice().sort(() => r() - .5).slice(0, n);
}
function renderShelves(show){
  const el = $('#shelves'); if(!show){ el.innerHTML = ''; return; }
  const byShow = {}; episodes.forEach(e => (byShow[e.show] = byShow[e.show] || []).push(e));
  const rows = PROGRAMMES.filter(p => (byShow[p[0]] || []).length >= 2).slice(0, 5);
  el.innerHTML = rows.map(([n], idx) => {
    const picks = dailyPick(byShow[n], 10);
    return `<section class="shelf"><div class="sec"><h2>${emblem(n,'hem')}${esc(n)}</h2><button class="seeall" data-show="${esc(n)}">See all</button></div>
      <div class="rail">${picks.map(e => `<button class="card" data-id="${esc(e.id)}">${artHTML(e)}<div class="t">${esc(e.title)}</div><div class="m">${niceDate(e.date)}</div></button>`).join('')}</div></section>`;
  }).join('');
}

/* ================= Bento: Tonight ================= */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function tonightShows(){
  const now = new Date(), md = String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  const dated = episodes.filter(e => e.date && e.date.length === 10);
  const exact = dated.filter(e => e.date.slice(5) === md);
  if(exact.length) return { exact:true, list:exact.sort((a,b)=>a.date.localeCompare(b.date)) };
  const doy = d => { const [m, dd] = d.slice(5).split('-').map(Number); return m*31 + dd; }, t = doy('0000-'+md);
  const best = dated.slice().sort((a,b) => Math.min(Math.abs(doy(a.date)-t), 403-Math.abs(doy(a.date)-t)) - Math.min(Math.abs(doy(b.date)-t), 403-Math.abs(doy(b.date)-t)));
  return { exact:false, list:best.slice(0,1) };
}
let storageText = '';
if(navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(x => { storageText = x.usage ? (x.usage/1048576 > 1024 ? (x.usage/1073741824).toFixed(1)+' GB' : Math.round(x.usage/1048576)+' MB') + ' used' : ''; }).catch(()=>{});
function renderBento(){

  const b = $('#bento'); b.style.display = show ? '' : 'none'; if(!show) return;
  const now = new Date(), tn = tonightShows(), first = tn.list[0];
  const years = [...new Set(tn.list.map(e => e.year))];
  const favN = Object.keys(state.favs).length, offN = savedKeys.size;
  b.innerHTML = `
    <button class="tile tonight" data-t="tonight" ${first ? `data-id="${esc(first.id)}"` : ''}>
      <span class="k">${tn.exact ? 'On this night' : 'Closest to tonight'}</span>
      <span class="big">${now.getDate()} <em>${MONTHS[now.getMonth()]}</em></span>
      ${first ? `<span class="s">${tn.exact ? `${tn.list.length} broadcast${tn.list.length>1?'s':''} · ${years.join(', ')}` : niceDate(first.date) + ' · ' + esc(first.show)}</span><span class="ep">${esc(first.title)}</span><span class="go">${I.play2}</span>` : '<span class="s">No dated shows yet</span>'}
    </button>
    <button class="tile" data-t="spin"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L14 10h7V3l-2.64 2.64A8.96 8.96 0 0 0 12 3z"/></svg><span class="v">Wild Card</span><span class="s">Random caller · tap to dial</span></button>
    <button class="tile" data-t="fav"><svg viewBox="0 0 24 24"><path d="M12 17.3 6.2 21l1.6-6.6L2.7 10l6.7-.6L12 3.2l2.6 6.2 6.7.6-5.1 4.4 1.6 6.6z"/></svg><span class="v">${favN}</span><span class="s">Favourite${favN===1?'':'s'}</span></button>
    <button class="tile wide" data-t="saved"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zm7-3 6-6-1.4-1.4-3.6 3.6V3h-2v10.2L7.4 9.6 6 11z"/></svg><span><span class="v">${offN} offline</span><span class="s" style="display:block">${storageText || 'Save shows for no-signal listening'}</span></span></button>`;
}

/* ================= Player ================= */
const audio = $('#audio');
let blobUrl = null;
async function loadEpisode(e, autoplay){
  if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
  audio.dataset.id = e.id;
  if(e.demo){ audio.removeAttribute('src'); }
  else {
    let src = fileUrl(e);
    if(savedKeys.has(e.id)){ try{ const b = await db.get(e.id); if(b){ blobUrl = URL.createObjectURL(b); src = blobUrl; } }catch(x){} }
    audio.src = src; audio.playbackRate = state.speed;
    const p = state.pos[e.id];
    audio.addEventListener('loadedmetadata', function once(){ audio.removeEventListener('loadedmetadata', once); if(p && p.t && p.t < audio.duration-10) audio.currentTime = p.t; audio.playbackRate = state.speed; });
  }

/* ================= Waveform scrubber ================= */
const WAVE_SEGS = 120, WAVE_CHUNK = 12000, WAVE_KEY = 'abr.wave.';
const wave = { id:null, peaks:null, progress:0, preview:null, loading:false };

let actx = null;
const getCtx = () => actx || (actx = new (window.AudioContext || window.webkitAudioContext)());

async function sliceLevel(getBuf){

}

async function loadWave(e){

  { const p = state.pos[e.id]; wave.progress = p && p.d ? p.t/p.d : 0; }
  const cached = store.get(WAVE_KEY + e.id, null);
  if(cached){ wave.peaks = cached; drawWave(); return; }
  if(e.demo || !e.size){ wave.peaks = fakePeaks(e); wave.approx = true; drawWave(); return; }
  wave.peaks = new Array(WAVE_SEGS).fill(null); wave.loading = true; drawWave();
  let blob = null; if(savedKeys.has(e.id)){ try{ blob = await db.get(e.id); }catch(x){} }
  const raw = new Array(WAVE_SEGS).fill(null), url = fileUrl(e), size = blob ? blob.size : e.size;
  let next = 0, failed = 0;
  const worker = async () => {

(function(){
  const el = $('#scrub'), bub = $('#bubble'), mode = $('#scrubMode');
  let down = false, x0 = 0, y0 = 0, p0 = 0, moved = false, lastX = 0, acc = 0;
  const speeds = [[0,1,''],[50,.5,'Half-speed scrubbing'],[110,.25,'Quarter-speed scrubbing'],[170,.1,'Fine scrubbing']];
  const speedFor = dy => { let s = speeds[0]; for(const sp of speeds) if(dy >= sp[0]) s = sp; return s; };
  function show(f, clientX){
    const e = current(); if(!e) return; const r = el.getBoundingClientRect(), d = durOf(e);

const curTime = e => (audio.dataset.id === e.id && audio.duration) ? audio.currentTime : ((state.pos[e.id] && state.pos[e.id].t) || 0);
function updateMarkBadge(){ const e = current(), n = e && state.marks[e.id] ? state.marks[e.id].length : 0; $('#markVal').textContent = n ? `Marks (${n})` : 'Mark'; $('#markBtn').classList.toggle('on', n > 0); }
function openMarks(){
  const e = current(); if(!e) return; const t = Math.floor(curTime(e)), marks = (state.marks[e.id] || []).slice().sort((a,b) => a.t - b.t);
  $('#sheet').innerHTML = `<div class="grab"></div><div class="hd"><div style="flex:1"><div class="t">Bookmarks</div><div class="m">${esc(e.title)}</div></div></div>
    <input class="field" id="markNote" maxlength="80" placeholder="Note for ${fmt(t)} (optional) – e.g. the Area 51 caller">
    <button class="btn" data-m="add" data-t="${t}">Bookmark ${fmt(t)}</button>
    ${marks.length ? marks.map((m,i) => `<div class="li"><button class="tm" data-m="go" data-t="${m.t}">${fmt(m.t)}</button><div class="tx" data-m="go" data-t="${m.t}"><div class="t">${esc(m.note || 'Bookmark')}</div></div><button class="x" data-m="del" data-t="${m.t}" aria-label="Delete">${I.trash}</button></div>`).join('') : '<div class="empty">Your marks show up here and as pins on the waveform.</div>'}`;
  $('#sheet').dataset.id = ''; $('#sheet').classList.add('show'); $('#scrim').classList.add('show');
}
$('#sheet').addEventListener('click', ev => {
  const b = ev.target.closest('[data-m]'); if(!b) return; const e = current(); if(!e) return; const t = +b.dataset.t;
  if(b.dataset.m === 'add'){ const note = ($('#markNote').value || '').trim(); (state.marks[e.id] = state.marks[e.id] || []).push({ t, note }); saveState(); updateMarkBadge(); drawWave(); toast('Bookmarked ' + fmt(t)); closeSheet(); }
  if(b.dataset.m === 'go'){ closeSheet(); const d = durOf(e); if(d) seekTo(t/d); }
  if(b.dataset.m === 'del'){ state.marks[e.id] = (state.marks[e.id]||[]).filter(m => m.t !== t); saveState(); updateMarkBadge(); drawWave(); openMarks(); }
});
$('#markBtn').onclick = openMarks;

/* ================= Share a moment ================= */
function shareUrl(e, t){
  const u = new URL(location.href.split('#')[0].split('?')[0]);
  u.searchParams.set('ep', e.id); if(t > 5) u.searchParams.set('t', Math.floor(t));
  return u.toString();
}
async function shareMoment(e){
  const t = audio.dataset.id === e.id ? curTime(e) : 0, url = shareUrl(e, t);
  const text = `${e.title} (${e.show}, ${niceDate(e.date)})${t > 5 ? ' from ' + fmt(t) : ''}`;
  try{ if(navigator.share){ await navigator.share({ title:'Art Bell Radio', text, url }); return; } }catch(x){ if(x && x.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text + '\n' + url); toast('Link copied'); }catch(x){ toast('Couldn’t share from here — works once the app is hosted'); }
}
function handleDeepLink(){
  let p; try{ p = new URLSearchParams(location.search); }catch(x){ return; }
  const id = p.get('ep'); if(!id) return; const e = byId(id); if(!e){ toast('That show isn’t in the library any more'); return; }
  const t = +p.get('t') || 0;
  if(t){ state.pos[e.id] = { t, d: Math.max(t + 1, (state.pos[e.id] && state.pos[e.id].d) || e.length || t + 1) }; saveState(); }
  loadEpisode(e, false); openNP(); toast(t ? `Tap play to start at ${fmt(t)}` : 'Tap play to start');
  try{ history.replaceState(null, '', location.pathname); }catch(x){}
}

/* ================= Voice boost ================= */
const boost = { ctx:null, src:null, chain:null, ok:null };
function buildBoost(){
  const ctx = boost.ctx = getCtx();
  boost.src = ctx.createMediaElementSource(audio);
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
  const pres = ctx.createBiquadFilter(); pres.type = 'peaking'; pres.frequency.value = 2600; pres.Q.value = .9; pres.gain.value = 4;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -30; comp.knee.value = 18; comp.ratio.value = 4.5; comp.attack.value = .004; comp.release.value = .25;
  const make = ctx.createGain(); make.gain.value = 1.6;
  hp.connect(pres); pres.connect(comp); comp.connect(make); make.connect(ctx.destination);
  boost.chain = hp;
}
function routeBoost(){
  if(!boost.src) return; try{ boost.src.disconnect(); }catch(x){}
  boost.src.connect(state.boost ? boost.chain : boost.ctx.destination);
}
async function setBoost(on){
  const e = current();
  if(e && e.demo){ toast('Preview mode — voice boost works once hosted'); return; }
  state.boost = on; saveState(); $('#boostBtn').classList.toggle('on', on);
  if(!on){ routeBoost(); toast('Voice boost off'); return; }
  try{
    if(!boost.src){
      // Web Audio needs CORS access to the stream; reload the current show with it
      const t = audio.currentTime, playing = !audio.paused, src = audio.currentSrc;
      audio.crossOrigin = 'anonymous';
      if(src && !src.startsWith('blob:')){
        audio.src = src; await new Promise((res, rej) => { audio.addEventListener('loadedmetadata', res, {once:true}); audio.addEventListener('error', rej, {once:true}); });
        audio.currentTime = t;
      }
      buildBoost(); if(playing) await audio.play();
    }
    if(boost.ctx.state === 'suspended') await boost.ctx.resume();
    routeBoost(); toast('Voice boost on — quiet callers lifted, loud bits tamed');
  }catch(x){
    state.boost = false; saveState(); $('#boostBtn').classList.remove('on');
    audio.removeAttribute('crossorigin'); const e2 = current(); if(e2) loadEpisode(e2, true);
    toast('Archive.org didn’t allow voice boost for this file', 3500);
  }
}
$('#boostBtn').onclick = () => setBoost(!state.boost);
if(state.boost) $('#boostBtn').classList.add('on');
// if boost was left on, enable it on first play (needs a user gesture)
audio.addEventListener('play', () => { if(state.boost && !boost.src) setBoost(true); else if(boost.ctx && boost.ctx.state === 'suspended') boost.ctx.resume(); });

/* ================= Themes ================= */
const THEMES = {
  'Amber': { '--accent':'#ffa53d', '--accent-soft':'rgba(255,165,61,.14)', '--glow':'rgba(255,140,30,.35)', '--bg':'#08090c', '--surface':'#111318', '--surface-2':'#191c23' },
  'Phosphor':   { '--accent':'#5dff8a', '--accent-soft':'rgba(93,255,138,.12)', '--glow':'rgba(60,255,120,.28)', '--bg':'#050906', '--surface':'#0c140e', '--surface-2':'#132016' },
  'Area 51':    { '--accent':'#5ad1ff', '--accent-soft':'rgba(90,209,255,.13)', '--glow':'rgba(60,170,255,.32)', '--bg':'#05080d', '--surface':'#0d131c', '--surface-2':'#141c28' },
  'Dopamine':   { '--accent':'#ff4fa3', '--accent-soft':'rgba(255,79,163,.14)', '--glow':'rgba(190,70,255,.38)', '--bg':'#0a0710', '--surface':'#151020', '--surface-2':'#1e172c' }
};
function applyTheme(name){
  const t = THEMES[name] || THEMES['Amber'];
  for(const k in t) document.documentElement.style.setProperty(k, t[k]);
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = t['--bg'];
  drawWave();
}
applyTheme(state.theme);

/* ================= Settings ================= */
if(state.calm) document.body.classList.add('calm');
$('#gear').onclick = () => {
  const cached = store.get(INDEX_KEY, null);
  $('#sheet').innerHTML = `<div class="grab"></div>
    <div class="hd"><div><div class="t">Settings</div><div class="m">${episodes.length.toLocaleString('en-GB')} shows in your library${cached ? ' · updated ' + new Date(cached.at).toLocaleDateString('en-GB') : ''}</div></div></div>
    <div class="swatches">${Object.entries(THEMES).map(([n,t]) => `<button class="sw${(state.theme||'Amber')===n?' on':''}" data-theme="${n}"><i style="background:radial-gradient(circle at 70% 20%,${t['--accent']},${t['--bg']} 80%)"></i>${n}</button>`).join('')}</div>
    <button class="act" data-s="calm"><span>Reduce motion${sysReduce.matches ? '<br><small style="margin:0;color:var(--muted)">On in your phone’s settings</small>' : ''}</span><span class="toggle${calm() ? ' on' : ''}"></span></button>
    <button class="act" data-s="refresh">Refresh library from archive.org</button>
    <button class="act" data-s="sources">Sources<small>${SOURCES.length} collections</small></button>`;
  $('#sheet').dataset.id = ''; $('#sheet').classList.add('show'); $('#scrim').classList.add('show');
};
$('#sheet').addEventListener('click', ev => {
  const th = ev.target.closest('[data-theme]');
  if(th){ state.theme = th.dataset.theme; saveState(); applyTheme(state.theme); document.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === th)); if(navigator.vibrate && !calm()) navigator.vibrate(8); return; }
  const b = ev.target.closest('[data-s]'); if(!b) return;
  if(b.dataset.s === 'calm'){ state.calm = !state.calm; saveState(); document.body.classList.toggle('calm', state.calm); b.querySelector('.toggle').classList.toggle('on', state.calm);
    toast(state.calm ? 'Motion reduced: no animations, sliding or vibration' : 'Motion back on'); }
  if(b.dataset.s === 'refresh'){ closeSheet(); loadLibrary(true); }
  if(b.dataset.s === 'sources'){ closeSheet(); toast('Internet Archive: ' + SOURCES.length + ' Art Bell collections + search', 3500); }
});

window.addEventListener('pagehide', persistPos);
document.addEventListener('visibilitychange', () => { if(document.hidden) persistPos(); });
updatePP();
loadLibrary(false);
// Installable app: register the service worker when hosted (not available inside previews)
if('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:'){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(x){} }
</script>
